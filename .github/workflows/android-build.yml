name: Android Build
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Execution failed|Could not|Caused by|Unresolved|SDK|license" build.log | head -25 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Upload APK and build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-hub-debug-apk-and-report
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/**
            app/build/outputs/logs/**
          if-no-files-found: warn
