name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain --stacktrace 2>&1 | tee test.log

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --console=plain 2>&1 | tee lint.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee build.log

      - name: Surface errors as annotations
        if: failure()
        shell: bash
        run: |
          cat test.log lint.log build.log 2>/dev/null | grep -E "^e: |error:|FAILED|What went wrong|Execution failed|Caused by|Unresolved|AssertionError|expected" | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line:0:400}"; done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: travelhub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelhub-build-and-test-report
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-debug.*
            *.log
          if-no-files-found: warn
          retention-days: 30
